<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Alamin Vault</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
:root{--bg:#0A0A0A;--gold:#D4AF37;--gold2:#FFD700;--card:#111;--line:rgba(212,175,55,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:"Helvetica Neue",Arial,sans-serif;color:#EDE3C2;
  background-color:#0A0A0A;
  background-image:
    repeating-linear-gradient(45deg,rgba(212,175,55,0.08) 0 1px,transparent 1px 20px),
    repeating-linear-gradient(-45deg,rgba(212,175,55,0.05) 0 1px,transparent 1px 20px),
    repeating-linear-gradient(45deg,rgba(212,175,55,0.03) 0 1px,transparent 1px 60px),
    radial-gradient(ellipse at 50% 0%,rgba(212,175,55,0.10),transparent 60%);
}
.screen{display:none;min-height:100%;max-width:520px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 20px calc(90px + env(safe-area-inset-bottom))}
.screen.active{display:block}
h1{font-weight:300;letter-spacing:.35em;text-transform:uppercase;color:var(--gold2);text-align:center;margin:.4em 0;font-size:1.5rem}
.sub{text-align:center;color:var(--gold);font-size:.7rem;letter-spacing:.3em;text-transform:uppercase}
input,textarea{width:100%;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:14px;color:#fff;padding:14px 16px;font-size:1rem;outline:none;font-family:inherit}
input:focus,textarea:focus{border-color:var(--gold2);box-shadow:0 0 14px rgba(212,175,55,.25)}
textarea{min-height:160px;resize:vertical}
label{display:block;margin:18px 0 8px;color:var(--gold);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}
.btn{width:100%;padding:15px;border-radius:14px;border:1px solid var(--gold);background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0A0A0A;font-weight:700;letter-spacing:.15em;text-transform:uppercase;font-size:.85rem;cursor:pointer;margin-top:12px}
.btn.ghost{background:transparent;color:var(--gold2)}
/* Lock */
#lock{text-align:center;padding-top:8vh}
.fp{width:140px;height:140px;margin:24px auto;cursor:pointer;animation:glow 2.8s ease-in-out infinite;border-radius:50%}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px rgba(212,175,55,.4))}50%{filter:drop-shadow(0 0 22px rgba(255,215,0,.95))}}
.secure{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:22px;color:var(--gold);font-size:.7rem;letter-spacing:.25em;text-transform:uppercase}
#msg{min-height:20px;color:#ff8a7a;font-size:.8rem;margin-top:10px}
/* Notes */
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{margin:0;text-align:left;font-size:1.2rem}
.iconbtn{background:none;border:1px solid var(--line);border-radius:12px;color:var(--gold2);width:42px;height:42px;font-size:1.4rem;cursor:pointer}
.tabs{display:flex;gap:8px;margin:20px 0}
.tab{flex:1;padding:10px;text-align:center;border:1px solid var(--line);border-radius:12px;color:var(--gold);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.tab.on{background:rgba(212,175,55,.15);color:var(--gold2);border-color:var(--gold2)}
.note{background:linear-gradient(160deg,#141414,#0c0c0c);border:1px solid var(--gold);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 0 18px rgba(212,175,55,.08)}
.nh{display:flex;gap:12px;align-items:center}
.ni{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;color:var(--gold2);flex:none}
.nt{flex:1;font-weight:600;color:var(--gold2)}
.nb{margin-top:12px;color:#cfc6a6;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--gold)}
.del{background:none;border:0;color:#7a6a30;cursor:pointer;font-size:1rem}
.empty{text-align:center;color:#7a6a30;padding:40px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;gap:0;background:rgba(10,10,10,.95);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
nav.show{display:flex}
nav button{flex:1;max-width:170px;background:none;border:0;color:#7a6a30;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;padding:6px;cursor:pointer}
nav button.on{color:var(--gold2)}
nav svg{display:block;margin:0 auto 4px}
/* Add */
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sw{width:50px;height:28px;border-radius:20px;border:1px solid var(--line);background:#222;position:relative;cursor:pointer;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#777;transition:.25s}
.sw.on{background:linear-gradient(135deg,var(--gold),var(--gold2))}
.sw.on::after{left:25px;background:#0A0A0A}
.tag{cursor:pointer;user-select:none}
.tag.on{background:rgba(212,175,55,.2);color:var(--gold2);border-color:var(--gold2)}
.ta{position:relative}
.ta svg{position:absolute;right:14px;top:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.show{display:flex}
.sheet>div{background:#0f0f0f;border:1px solid var(--gold);border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:520px}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<section id="lock" class="screen active">
  <div class="sub">Black Edition</div>
  <h1>Alamin Vault</h1>
  <svg class="fp" id="fpBtn" viewBox="0 0 64 64" fill="none" stroke="#D4AF37" stroke-width="2.2" stroke-linecap="round">
    <path d="M32 6c-12 0-22 9-22 21v6"/><path d="M54 33v-6C54 15 44 6 32 6" />
    <path d="M18 54c3-5 4-10 4-17 0-6 4-10 10-10s10 4 10 10c0 8 1 13 3 18"/>
    <path d="M26 58c3-6 4-12 4-21 0-1 .9-2 2-2s2 1 2 2c0 8 1 14 4 20"/>
    <path d="M12 44c1-4 2-7 2-11"/><path d="M46 46c1 3 2 6 4 9"/>
    <path d="M20 22c3-5 7-7 12-7s10 3 12 8" stroke="#FFD700"/>
  </svg>
  <div class="sub" id="lockHint">Secure Biometric</div>
  <label for="pw" style="text-align:left">Master Password</label>
  <input id="pw" type="password" placeholder="Enter master password" autocomplete="current-password">
  <button class="btn" id="unlockBtn">Unlock Vault</button>
  <button class="btn ghost" id="bioBtn">Use Fingerprint</button>
  <div id="msg"></div>
  <div class="secure">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
    AES-256 · Secure Biometric
  </div>
</section>

<!-- NOTES LIST -->
<section id="notes" class="screen">
  <div class="top"><h1>Vault Notes</h1><button class="iconbtn" id="addBtn">+</button></div>
  <div class="tabs">
    <div class="tab on" data-t="all">All</div>
    <div class="tab" data-t="secured">Secured</div>
    <div class="tab" data-t="recent">Recent</div>
  </div>
  <div id="list"></div>
</section>

<!-- ADD NOTE -->
<section id="add" class="screen">
  <div class="top"><button class="iconbtn" id="backBtn">‹</button><h1 style="flex:1;text-align:center;font-size:1.1rem">New Note</h1><span style="width:42px"></span></div>
  <label for="title">Title</label>
  <input id="title" placeholder="e.g. Credit Card PIN" maxlength="80">
  <label for="body">Note</label>
  <div class="ta"><textarea id="body" placeholder="Write your secret…"></textarea>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div>
  <div class="row"><span style="color:var(--gold2);letter-spacing:.1em;font-size:.85rem">ENCRYPT (SECURED)</span><div class="sw on" id="encSw"></div></div>
  <label>Tags</label>
  <div class="chips"><span class="chip tag" data-tag="Finance">Finance</span><span class="chip tag" data-tag="Personal">Personal</span></div>
  <button class="btn" id="saveBtn">Save Note</button>
</section>

<!-- SETTINGS SHEET -->
<div class="sheet" id="sheet"><div>
  <h1 style="font-size:1.1rem">Settings</h1>
  <button class="btn" id="lockNow">Lock Now</button>
  <button class="btn ghost" id="wipe">Erase Vault</button>
  <button class="btn ghost" id="closeSheet">Close</button>
</div></div>

<nav id="nav">
  <button data-n="notes" class="on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>Notes</button>
  <button data-n="vault"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3"/></svg>Vault</button>
  <button data-n="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Settings</button>
</nav>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ICONS={
 bank:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-5 9 5M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg>',
 passport:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 17h6"/></svg>',
 crypto:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M10 7v10M14 7v10M8.5 9h6a1.7 1.7 0 010 3.4h-6M8.5 12.4h6.5a1.8 1.8 0 010 3.6H8.5"/></svg>',
 note:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/></svg>'};
const pickIcon=t=>{t=t.toLowerCase();return /bank|card|pin|account/.test(t)?ICONS.bank:/passport|id|visa/.test(t)?ICONS.passport:/crypto|seed|wallet|btc|eth/.test(t)?ICONS.crypto:ICONS.note};

let KEY=null, HELD=null, notes=[], tab='all', tags=new Set(), enc=true, timer, revealed=new Set();
const LS=localStorage, ITER=50000;

const derive=(pw,salt)=>CryptoJS.PBKDF2(pw,CryptoJS.enc.Hex.parse(salt),{keySize:8,iterations:ITER,hasher:CryptoJS.algo.SHA256}).toString();
const encr=(o,k)=>CryptoJS.AES.encrypt(JSON.stringify(o),k).toString();
const decr=(s,k)=>{try{const t=CryptoJS.AES.decrypt(s,k).toString(CryptoJS.enc.Utf8);return t?JSON.parse(t):null}catch(e){return null}};
const save=()=>LS.setItem('av_data',encr(notes,KEY));

function show(id){$$('.screen').forEach(s=>s.classList.toggle('active',s.id===id));$('#nav').classList.toggle('show',id==='notes');window.scrollTo(0,0)}
function msg(t){$('#msg').textContent=t}

/* AUTH */
const hasVault=()=>!!LS.getItem('av_check');
function refreshLockUI(){$('#unlockBtn').textContent=hasVault()?'Unlock Vault':'Create Vault';$('#pw').placeholder=hasVault()?'Enter master password':'Choose a master password (min 8)'}
async function unlock(){
  const pw=$('#pw').value; if(!pw)return msg('Enter your master password');
  if(!hasVault()){
    if(pw.length<8)return msg('Use at least 8 characters');
    const salt=CryptoJS.lib.WordArray.random(16).toString();
    LS.setItem('av_salt',salt); KEY=derive(pw,salt);
    LS.setItem('av_check',encr('ALAMIN',KEY));
    const now=Date.now();
    notes=[
     {id:now+1,title:'Bank Account',body:'Account: ••••••\nIBAN: (add yours)',tags:['Finance'],secured:true,ts:now},
     {id:now+2,title:'Passport',body:'Number: (add yours)\nExpiry: ',tags:['Personal'],secured:true,ts:now-1},
     {id:now+3,title:'Crypto Seed',body:'12 words: (add yours)',tags:['Finance'],secured:true,ts:now-2}];
    save();
  }else{
    const k=derive(pw,LS.getItem('av_salt'));
    if(decr(LS.getItem('av_check'),k)!=='ALAMIN')return msg('Incorrect password');
    KEY=k; notes=decr(LS.getItem('av_data'),KEY)||[];
  }
  HELD=KEY; enter();
}
function enter(){$('#pw').value='';msg('');revealed.clear();render();show('notes');resetTimer()}
function lock(){KEY=null;notes=[];revealed.clear();show('lock');$('#sheet').classList.remove('show');$('#pw').value='';refreshLockUI();clearTimeout(timer)}
function resetTimer(){clearTimeout(timer);if(KEY)timer=setTimeout(lock,120000)}
['click','keydown','touchstart','scroll'].forEach(e=>addEventListener(e,resetTimer,{passive:true}));

/* BIOMETRIC (WebAuthn) — gates re-unlock after auto-lock; the key never leaves memory */
async function bio(){
  if(!window.PublicKeyCredential)return msg('Biometrics not supported here');
  if(!HELD)return msg('Unlock with master password once first');
  try{
    const ch=crypto.getRandomValues(new Uint8Array(32));
    let id=LS.getItem('av_cred');
    if(!id){
      const c=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:'Alamin Vault'},
        user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'owner',displayName:'Owner'},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
      LS.setItem('av_cred',btoa(String.fromCharCode(...new Uint8Array(c.rawId))));
    }else{
      const raw=Uint8Array.from(atob(id),c=>c.charCodeAt(0));
      await navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{type:'public-key',id:raw}],userVerification:'required',timeout:60000}});
    }
    KEY=HELD; notes=decr(LS.getItem('av_data'),KEY)||[]; enter();
  }catch(e){msg('Biometric cancelled or failed')}
}

/* RENDER */
function render(){
  let l=[...notes].sort((a,b)=>b.ts-a.ts);
  if(tab==='secured')l=l.filter(n=>n.secured);
  if(tab==='recent')l=l.filter(n=>Date.now()-n.ts<6048e5).slice(0,10);
  $('#list').innerHTML=l.length?l.map(n=>{
    const hide=n.secured&&!revealed.has(n.id);
    const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    return `<div class="note" data-id="${n.id}"><div class="nh"><div class="ni">${pickIcon(n.title)}</div>
      <div class="nt">${esc(n.title)}</div>${n.secured?'🔒':''}<button class="del" data-del="${n.id}">✕</button></div>
      <div class="nb">${hide?'••••••••••  (tap to reveal)':esc(n.body)}</div>
      <div class="chips">${n.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div>`}).join('')
    :'<div class="empty">No notes here yet</div>';
}
$('#list').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');
  if(d){if(confirm('Delete this note?')){notes=notes.filter(n=>n.id!=d.dataset.del);save();render()}return}
  const c=e.target.closest('.note');if(!c)return;
  const id=+c.dataset.id;revealed.has(id)?revealed.delete(id):revealed.add(id);render();
});
$$('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.t;$$('.tab').forEach(x=>x.classList.toggle('on',x===t));render()});

/* NAV */
$$('nav button').forEach(b=>b.onclick=()=>{
  $$('nav button').forEach(x=>x.classList.toggle('on',x===b));
  if(b.dataset.n==='settings')$('#sheet').classList.add('show');
  else{tab=b.dataset.n==='vault'?'secured':'all';$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===tab));render()}
});
$('#closeSheet').onclick=()=>$('#sheet').classList.remove('show');
$('#lockNow').onclick=lock;
$('#wipe').onclick=()=>{if(confirm('Permanently erase ALL vault data?')){['av_data','av_check','av_salt','av_cred'].forEach(k=>LS.removeItem(k));HELD=null;lock()}};

/* ADD */
$('#addBtn').onclick=()=>{$('#title').value='';$('#body').value='';tags.clear();enc=true;$('#encSw').classList.add('on');$$('.tag').forEach(t=>t.classList.remove('on'));show('add')};
$('#backBtn').onclick=()=>show('notes');
$('#encSw').onclick=e=>{enc=!enc;e.currentTarget.classList.toggle('on',enc)};
$$('.tag').forEach(t=>t.onclick=()=>{const v=t.dataset.tag;tags.has(v)?tags.delete(v):tags.add(v);t.classList.toggle('on')});
$('#saveBtn').onclick=()=>{
  const title=$('#title').value.trim(),body=$('#body').value;
  if(!title)return alert('Please add a title');
  notes.push({id:Date.now(),title,body,tags:[...tags],secured:enc,ts:Date.now()});
  save();render();show('notes');
};

$('#unlockBtn').onclick=unlock;
$('#pw').addEventListener('keydown',e=>e.key==='Enter'&&unlock());
$('#bioBtn').onclick=bio;$('#fpBtn').onclick=bio;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&KEY)resetTimer()});
refreshLockUI();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
